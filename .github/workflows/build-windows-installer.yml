name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows-installer.yml'
      - 'NuGet.Config'
      - 'labs.config.json'
      - 'launcher/windows/src/**'
      - 'scripts/sync-launcher-catalog.js'
      - 'scripts/verify-localhost.js'
      - 'windows/installer/**'
      - 'windows/scripts/**'
  pull_request:
    paths:
      - '.github/workflows/build-windows-installer.yml'
      - 'NuGet.Config'
      - 'labs.config.json'
      - 'launcher/windows/src/**'
      - 'scripts/sync-launcher-catalog.js'
      - 'scripts/verify-localhost.js'
      - 'windows/installer/**'
      - 'windows/scripts/**'

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Ensure Inno Setup is available
        shell: powershell
        run: |
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            choco install innosetup --no-progress -y
          } else {
            Write-Host "Chocolatey no esta disponible. El script usara el fallback local."
          }

      - name: Build and verify Windows installer
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\windows\scripts\build-windows-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unikernel-control-center-installer-win-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error
