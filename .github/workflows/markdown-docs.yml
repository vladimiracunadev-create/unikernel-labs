name: markdown-docs

on:
  push:
    branches: ["**"]
    paths:
      - '**/*.md'
      - '.github/workflows/markdown-docs.yml'
      - '.markdownlint.json'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/markdown-docs.yml'
      - '.markdownlint.json'
  workflow_dispatch:

jobs:
  lint:
    name: Lint markdown files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: markdownlint
        uses: davidanson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !node_modules/**/*.md
