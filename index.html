<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unikernel Control Center v1</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="header">
    <div class="container header-inner">
      <div class="brand">
        <img src="assets/branding/ucc-logo.png" alt="UCC">
        <div>
          <p class="eyebrow">Unikernel Control Center v1</p>
          <h1>Workspace Console</h1>
        </div>
      </div>
      <div class="header-right">
        <div class="stats-bar">
          <div class="stat">
            <span class="stat-val" id="stat-running">0</span>
            <span class="stat-lbl">corriendo</span>
          </div>
          <div class="stat stat-sep">
            <span class="stat-val" id="stat-ready">0</span>
            <span class="stat-lbl">disponibles</span>
          </div>
          <div class="stat stat-sep">
            <span class="stat-val" id="stat-planned">0</span>
            <span class="stat-lbl">próximamente</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn-hdr" id="btn-refresh">⟳ Actualizar</button>
          <button class="btn-hdr btn-hdr-danger" id="btn-stop-all">⏹ Detener todo</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ── Main ───────────────────────────────────────────────────────────── -->
  <main class="container">

    <!-- Diagnostics -->
    <div class="diag-panel" id="diag-panel">
      <div class="diag-row"><span class="diag-dot"></span><span>Verificando entorno…</span></div>
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <input id="search-input" type="search" placeholder="Buscar lab por nombre o puerto…" autocomplete="off">
      <span class="search-hint" id="env-hint">verificando entorno…</span>
    </div>

    <!-- Labs -->
    <div class="labs" id="labs">
      <div class="lab-placeholder">Cargando servicios…</div>
    </div>

  </main>

  <!-- ── Logs panel ──────────────────────────────────────────────────────── -->
  <div class="logs-overlay" id="logs-overlay"></div>
  <aside class="logs-panel" id="logs-panel">
    <div class="logs-hdr">
      <span id="logs-title">Logs</span>
      <div>
        <button class="btn-icon" id="btn-logs-refresh">⟳</button>
        <button class="btn-icon" id="logs-close">✕</button>
      </div>
    </div>
    <pre class="logs-body" id="logs-content">(sin output)</pre>
  </aside>

  <!-- ── Footer ──────────────────────────────────────────────────────────── -->
  <footer class="footer">
    <div class="container footer-inner">
      <span>Unikernel Control Center v1</span>
      <span>Windows + WSL2 + localhost · <a href="https://github.com/vladimiracunadev-create/unikernel-labs" target="_blank" rel="noreferrer">GitHub ↗</a></span>
    </div>
  </footer>

  <script src="dashboard.js"></script>
</body>
</html>
